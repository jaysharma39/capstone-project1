<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TechCorp Internal AI Assistant</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; background: #f4f6f8; }
  h1 { color: #1a3c5e; }
  #chat-box { background: white; border: 1px solid #ccc; border-radius: 6px; padding: 15px;
              height: 420px; overflow-y: auto; margin-bottom: 12px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; white-space: pre-wrap; }
  .user { background: #d6e8ff; text-align: right; }
  .bot  { background: #e9e9e9; }
  #input-row { display: flex; gap: 8px; }
  #message { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 10px 18px; border: none; background: #1a3c5e; color: white;
           border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
  <h1>TechCorp Internal AI Assistant</h1>
  <p style="color:#888;font-size:13px;">Lab build — vulnerable by design for security testing.</p>
  <div id="chat-box"></div>
  <div id="input-row">
    <input type="text" id="message" placeholder="Ask the assistant something...">
    <button onclick="sendMessage()">Send</button>
  </div>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const chatBox = document.getElementById("chat-box");
  const text = input.value;
  if (!text) return;

  chatBox.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });
  const data = await res.json();
  chatBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById("message").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
